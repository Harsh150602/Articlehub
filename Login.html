<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0"/>

  <title>Login - ArticleHub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{

      background:#f5f7fb;

      display:flex;
      justify-content:center;
      align-items:center;

      height:100vh;
    }

    .login-box{

      background:white;

      width:400px;

      padding:30px;

      border-radius:15px;

      box-shadow:
        0 5px 20px rgba(0,0,0,0.1);
    }

    h1{

      text-align:center;

      margin-bottom:25px;

      color:#2563eb;
    }

    input,
    button{

      width:100%;

      padding:12px;

      margin-top:12px;

      border-radius:10px;

      border:1px solid #d1d5db;

      font-size:16px;
    }

    button{

      background:#2563eb;

      color:white;

      border:none;

      cursor:pointer;
    }

    button:hover{

      background:#1d4ed8;
    }

  </style>

</head>

<body>

  <div class="login-box">

    <h1>
      Login
    </h1>

    <input
      type="email"
      id="email"
      placeholder="Email"
    />

    <input
      type="password"
      id="password"
      placeholder="Password"
    />

    <button onclick="login()">
      Login
    </button>
   
<p style="
  margin-top:20px;
  text-align:center;
">
  New Student?

  <a
    href="signup.html"
    style="
      color:#2563eb;
      font-weight:bold;
      text-decoration:none;
    "
  >
    Create Account
  </a>
</p>

  </div>

  <script>

    // SUPABASE
    const supabaseUrl =
      'https://xepbewcvbtcabwvgfxcj.supabase.co';

    const supabaseKey =
      'sb_publishable_7pOY59ShVNaBeucS4FaV2w_IAFvMqJZ';

    const supabaseClient =
      window.supabase.createClient(
        supabaseUrl,
        supabaseKey
      );

    // LOGIN
    async function login(){

      const email =
        document.getElementById('email').value;

      const password =
        document.getElementById('password').value;

      const { error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,
          password: password
        });

      if(error){

        alert(error.message);

        return;
      }

      alert(
        'Login Successful!'
      );

      window.location.href =
        'index.html';
    }

  </script>

</body>

</html>
